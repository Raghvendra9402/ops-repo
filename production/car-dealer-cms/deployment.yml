apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-dealer-dep
  namespace: car-dealer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-dealer-app
  template:
    metadata:
      labels:
        app: car-dealer-app
    spec:
      containers:
        - name: car-dealer-app
          image: xanderflinn/car-dealer-cms:c20ffd8585f6e6963732cd91c5e7392f1eed95cb
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: env-file
              readOnly: true
              mountPath: "/app/.env"
              subPath: .env
      volumes:
        - name: env-file
          secret:
            secretName: next-secret
