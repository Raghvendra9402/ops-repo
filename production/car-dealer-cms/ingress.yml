apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-dealer-ingress
  namespace: car-dealer
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: car-dealer-svc
                port:
                  number: 80
